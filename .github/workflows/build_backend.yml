name: Build backend

on:
  push:
    paths:
      - 'backend/**'
    branches:
      - main
      
  workflow_dispatch:
      
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # build
        
      - name: Build Backend Docker image
        run: |
          docker build -t ghcr.io/nexx42/portfolio_api ./backend
          
      # push  
        
      - name: Push Backend Docker image
        run: |
          docker push ghcr.io/nexx42/portfolio_api