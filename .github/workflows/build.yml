name: Build

on:
  push:
    branches:
      - main
      
  workflow_dispatch:
      
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # build
        
      - name: Build Backend Docker image
        run: |
          docker build -t ghcr.io/nexx42/portfolio_api ./backend

      - name: Build Frontend Docker image
        run: |
          docker build \
            --build-arg ENVIRONMENT=production \
            -t ghcr.io/nexx42/portfolio_frontend \
            ./frontend
          
      # push  
        
      - name: Push Backend Docker image
        run: |
          docker push ghcr.io/nexx42/portfolio_api

      - name: Push Frontend Docker image
        run: |
          docker push ghcr.io/nexx42/portfolio_frontend
          
